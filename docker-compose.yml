version: '3.8'
services:
  nginx:
    container_name: app-nginx
    image: app-nginx
    ports:
      - "8080:80"
    depends_on:
      - api0
      - api1
      - api2
      - api3
      - api4
    networks:
      - app-network

  api0:
    container_name: api0
    image: app
    ports:
      - "80"
    networks:
      - app-network
        
  api1:
    container_name: api1
    image: app
    ports:
      - "80"
    networks:
      - app-network
  
  api2:
    container_name: api2
    image: app
    ports:
      - "80"
    networks:
      - app-network

  api3:
    container_name: api3
    image: app
    ports:
      - "80"
    networks:
      - app-network

  api4:
    container_name: api4
    image: app
    ports:
      - "80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
