version: "3.8"
services:
  nginx:
    container_name: app-nginx
    image: app-nginx
    ports:
      - "8080:80"
    depends_on:
      api0:
        condition: service_healthy
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
      api4:
        condition: service_healthy
    networks:
      - app-network

  api0:
    container_name: api0
    image: app
    ports:
      - "80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
        
  api1:
    container_name: api1
    image: app
    ports:
      - "80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  api2:
    container_name: api2
    image: app
    ports:
      - "80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api3:
    container_name: api3
    image: app
    ports:
      - "80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api4:
    container_name: api4
    image: app
    ports:
      - "80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app-network:
    driver: bridge
